name: Publikuj stronę Luma

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki strony
        uses: actions/checkout@v4
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Przygotuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
